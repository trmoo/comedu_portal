<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 티쳐무의 정보교육 포털 아이콘 — 머리 제목과 같은 파랑 → 보라 → 주황 바탕에 펼친 책 + 반짝임. © 2026 티쳐무 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- 펼친 책: 왼쪽 쪽 · 오른쪽 쪽 (가운데 틈이 책등) -->
  <path d="M30.5 22.5C25.5 19 18.5 18 11 19v26c7.5-1 14.5 0 19.5 3.5z" fill="#fff"/>
  <path d="M33.5 22.5C38.5 19 45.5 18 53 19v26c-7.5-1-14.5 0-19.5 3.5z" fill="#fff"/>
  <!-- 쪽 위의 줄: 큰 크기에서만 보이고 16px 에서는 흰 면으로 뭉친다 -->
  <g fill="none" stroke="#b9a6ff" stroke-width="2.2" stroke-linecap="round">
    <path d="M15.5 26c3.8-.4 7.4 0 10.5 1.3M15.5 31.5c3.8-.4 7.4 0 10.5 1.3M15.5 37c3.8-.4 7.4 0 10.5 1.3"/>
  </g>
  <!-- 오른쪽 쪽에 </> — 「정보」 수업이라는 표시 -->
  <path d="M41 28.5l-3.5 3.5 3.5 3.5M46 28.5l3.5 3.5-3.5 3.5" fill="none" stroke="#ff7a59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 반짝임 -->
  <path d="M50 5.5l1.7 4.3 4.3 1.7-4.3 1.7-1.7 4.3-1.7-4.3-4.3-1.7 4.3-1.7z" fill="#ffe27a"/>
</svg>
