<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영역으로 찾는 정보 수업 도구함</title>
<style>
  :root{
    --bg1:#eef4ff;
    --bg2:#fef6f0;
    --card:#ffffff;
    --ink:#1f2a44;
    --ink-soft:#5b6785;
    --line:#e6ebf5;
    --brand:#4f7cff;
    --brand-soft:#eaf0ff;
    --shadow:0 10px 30px rgba(38,63,140,.10);
    --shadow-hover:0 18px 44px rgba(38,63,140,.20);
    /* 제출형 활동지(선생님용 사본)에 쓰는 초록 — 글씨를 얹는 곳은 대비가 충분한 진한 쪽(--g-dark)을 쓴다 */
    --g:#10b981;
    --g-dark:#047857;
    --g-soft:#e3f7ef;
    --g-line:#bfe8d6;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  html.locked{overflow:hidden;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #dbe7ff 0%, transparent 55%),
      radial-gradient(1000px 560px at 100% 0%, #ffe6d6 0%, transparent 50%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:40px 22px 64px;}

  header.hero{text-align:center;margin-bottom:30px;}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--brand-soft);color:var(--brand);
    font-weight:700;font-size:13px;letter-spacing:.02em;
    padding:7px 14px;border-radius:999px;margin-bottom:16px;
  }
  h1{
    font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0 0 12px;
    font-weight:800;letter-spacing:-.02em;
  }
  h1 .grad{
    background:linear-gradient(100deg,#4f7cff,#8b5cf6 55%,#ff7a59);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{color:var(--ink-soft);font-size:16px;margin:0 auto;max-width:620px;line-height:1.6;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;
    margin:28px 0 8px;
  }
  .search{
    position:relative;flex:1 1 320px;max-width:440px;
  }
  .search input{
    width:100%;padding:13px 16px 13px 44px;border-radius:14px;
    border:1px solid var(--line);background:#fff;font-size:15px;color:var(--ink);
    box-shadow:var(--shadow);outline:none;transition:.2s;
  }
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.45;}

  .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 6px;}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:8px 15px;border-radius:999px;font-size:14px;font-weight:600;
    cursor:pointer;transition:.18s;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand);}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(79,124,255,.35);}

  .section{margin-top:34px;}
  .section-head{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:0 2px;}
  .section-head .dot{width:11px;height:11px;border-radius:4px;}
  .section-head h2{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;}
  .section-head .count{color:var(--ink-soft);font-size:14px;font-weight:600;}
  /* 칸 머리 밑 안내 한 줄 (지금은 제출형 활동지 칸에만 있다) */
  .section-note{
    margin:-4px 0 16px;padding:13px 16px;border-radius:14px;
    background:#fff;border:1px dashed var(--g-line);
    color:var(--ink-soft);font-size:14.5px;line-height:1.65;word-break:keep-all;
  }
  .section-note b{color:var(--ink);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}

  .card{
    display:flex;flex-direction:column;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:4px;
    background:var(--accent,#4f7cff);opacity:.9;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--accent,#4f7cff);}
  .card .icon{
    width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:var(--accent-soft,#eaf0ff);margin-bottom:14px;
  }
  .card h3{font-size:16.5px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;}
  .card p{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;line-height:1.55;flex:1;}
  .card .go{
    display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
    color:var(--accent,#4f7cff);
  }
  .card .url{font-size:11.5px;color:#9aa4bd;margin-top:8px;word-break:break-all;}
  .card.soon{border-style:dashed;box-shadow:none;background:#fbfcfe;}
  .card.soon:hover{transform:none;box-shadow:none;border-color:var(--line);}
  .card.soon::before{opacity:.35;}

  /* 제출형 활동지 카드 — 카드 안에 단추가 둘이라 <a> 로 감쌀 수 없다.
     제목 단추(.stretch)의 ::after 를 카드 전체로 넓혀 「카드 아무 데나 누르면 고르는 창」을 지키고,
     아래 두 단추만 그 위(z-index:2)에 올린다. */
  .card .stretch{
    color:inherit;text-decoration:none;font:inherit;background:none;border:0;padding:0;
    cursor:pointer;text-align:left;letter-spacing:inherit;
  }
  .card .stretch::after{content:"";position:absolute;inset:0;z-index:1;border-radius:18px;}
  .card .stretch:focus{outline:none;}
  .card .stretch:focus-visible::after{outline:3px solid var(--accent);outline-offset:-3px;}
  .card-actions{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;}
  .card-actions .ca{
    flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:46px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--g);
    background:#fff;color:var(--g-dark);font-size:14px;font-weight:800;text-decoration:none;
    transition:box-shadow .15s,transform .15s,background .15s;
  }
  .card-actions .ca.primary{background:var(--g-dark);border-color:var(--g-dark);color:#fff;}
  .card-actions .ca:hover{box-shadow:0 8px 18px rgba(16,185,129,.25);transform:translateY(-1px);}
  .card-actions .ca:focus-visible{outline:3px solid var(--g);outline-offset:2px;}
  .card-actions .ca.wait{border-style:dashed;color:var(--ink-soft);cursor:default;}

  .empty{text-align:center;color:var(--ink-soft);padding:60px 0;font-size:16px;display:none;}

  footer{text-align:center;margin-top:46px;color:var(--ink-soft);font-size:13px;line-height:1.7;}
  footer a{color:var(--brand);text-decoration:none;}

  /* ─── 카드를 누르면 뜨는 창: 교사용 사본 / 테스트 페이지 고르기 ─── */
  dialog.panel{
    width:min(620px, calc(100vw - 20px));max-height:calc(100vh - 28px);
    padding:0;border:0;border-radius:20px;overflow:auto;
    color:var(--ink);background:#fff;box-shadow:0 30px 80px rgba(20,30,60,.35);
    word-break:keep-all;overscroll-behavior:contain;
  }
  dialog.panel::backdrop{background:rgba(20,28,50,.55);}
  dialog.panel[open]{position:fixed;inset:0;margin:auto;}
  .p-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);}
  .g-icon{
    width:48px;height:48px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:var(--g-soft);
  }
  .g-titles{flex:1;min-width:0;}
  .g-kicker{font-size:13px;font-weight:800;color:var(--g-dark);}
  .p-head h2{margin:2px 0 0;font-size:21px;font-weight:800;letter-spacing:-.01em;}
  .g-close{
    flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:#fff;font-size:18px;cursor:pointer;color:var(--ink-soft);
  }
  .g-close:hover{border-color:var(--ink-soft);color:var(--ink);}
  .p-body{padding:16px 22px 22px;font-size:15.5px;line-height:1.65;}
  .p-desc{margin:0 0 6px;color:var(--ink-soft);}
  .choice{
    display:flex;align-items:center;gap:14px;margin:12px 0;padding:16px 18px;
    border-radius:16px;border:1.5px solid var(--line);background:#fff;
    color:var(--ink);text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s;
  }
  .choice:hover{border-color:var(--g);box-shadow:0 10px 24px rgba(16,185,129,.18);transform:translateY(-1px);}
  .choice:focus-visible{outline:3px solid var(--g);outline-offset:2px;}
  .choice.primary{border-color:var(--g);background:var(--g-soft);}
  .choice.wait{border-style:dashed;cursor:default;}
  .choice .c-ico{
    flex:none;width:50px;height:50px;border-radius:14px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid var(--line);
  }
  .choice .c-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .choice .c-txt b{font-size:17px;}
  .choice .c-txt small{font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .choice .c-go{flex:none;color:var(--g-dark);}
  .link-like{
    background:none;border:0;padding:8px 0;font:inherit;font-size:15px;font-weight:700;
    color:var(--g-dark);cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  }

  /* ─── 배포까지 따라 하는 안내 화면 (카드 목록 대신 보인다) ─── */
  .guide-page{max-width:880px;margin:0 auto;font-size:16px;line-height:1.7;word-break:keep-all;}
  .gp-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px;}
  .gp-tools{display:flex;flex-wrap:wrap;gap:8px;}
  .gp-head{
    display:flex;align-items:center;gap:16px;margin:0 0 16px;padding:22px 24px;
    border-radius:20px;background:var(--g-dark);color:#fff;box-shadow:var(--shadow);
  }
  .gp-head .g-icon{background:rgba(255,255,255,.18);}
  .gp-head .g-kicker{color:#d1fae5;}
  .gp-title{margin:2px 0 0;font-size:clamp(22px,4vw,30px);line-height:1.3;font-weight:800;letter-spacing:-.01em;}
  .gp-banner{
    margin:0 0 14px;padding:14px 18px;border-radius:14px;
    background:#fff8eb;border:1.5px solid #f3d9a4;font-weight:600;
  }
  .gp-bottom{margin-top:22px;text-align:center;}

  .g-pre{margin:0 0 16px;padding:12px 16px 12px 36px;background:#fff;border:1px solid var(--line);border-radius:14px;}
  .g-pre li{margin:3px 0;}

  .g-progress{display:flex;align-items:center;gap:12px;margin:6px 0 4px;}
  .g-progress .bar{flex:1;height:10px;border-radius:99px;background:#e3e8f1;overflow:hidden;}
  .g-progress .bar span{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:width .3s;}
  .g-progress .txt{font-size:14px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}

  /* 둘째 칸을 minmax(0,1fr) 로 두어야 폭이 좁을 때 그림 칸이 가로로 밀리며 줄어든다
     (그냥 1fr 이면 그림 최소 폭 560px 만큼 칸이 버텨 휴대폰에서 상자 밖으로 삐져나간다) */
  .step{
    display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;margin:14px 0;padding:18px 18px 16px;
    border:1.5px solid var(--line);border-radius:18px;background:#fff;transition:border-color .2s,background .2s;
  }
  .step .s-body{min-width:0;}
  .step.done{border-color:var(--g);background:#f5fcf8;}
  .step .num{
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--g-dark);color:#fff;font-weight:800;font-size:18px;
  }
  .step h3{margin:4px 0 10px;font-size:17.5px;line-height:1.55;font-weight:800;}
  .step ol{margin:6px 0 10px;padding-left:22px;}
  .step ol li{margin:6px 0;}
  .ui{
    display:inline-block;padding:0 8px;margin:1px 0;border-radius:7px;
    background:#f1f4fa;border:1px solid #dbe2ee;font-weight:700;font-size:.93em;line-height:1.6;
  }
  .path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 10px;}
  .path .where{font-size:14px;color:var(--ink-soft);margin-right:2px;}
  .path .sep{color:#9aa4bd;font-weight:800;}
  .hint{margin:8px 0;font-size:14.5px;color:var(--ink-soft);}
  .hint b{color:var(--ink);}

  .actions{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:48px;padding:10px 18px;border-radius:12px;
    border:1.5px solid #cfd8e8;background:#fff;color:var(--ink);
    font:inherit;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--ink-soft);}
  .btn.primary{background:var(--g-dark);border-color:var(--g-dark);color:#fff;}
  .btn.primary:hover{background:#065f46;border-color:#065f46;}
  .btn:disabled{background:#e9edf3;border-color:#e9edf3;color:#5b6785;cursor:not-allowed;}
  .btn.small{min-height:42px;padding:8px 14px;font-size:14px;}
  .btn:focus-visible{outline:3px solid var(--g);outline-offset:2px;}
  .link-box{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#f8fafc;color:var(--ink-soft);font-size:13px;font-family:ui-monospace,Consolas,monospace;
  }

  .setting{width:100%;margin:8px 0 6px;border-collapse:separate;border-spacing:0;
    border:1px solid var(--g-line);border-radius:12px;overflow:hidden;font-size:15px;}
  .setting th,.setting td{padding:10px 14px;text-align:left;vertical-align:middle;}
  .setting th{background:#f6f8fc;font-weight:600;width:56%;}
  .setting td{background:var(--g-soft);}
  .setting tr + tr th,.setting tr + tr td{border-top:1px solid var(--g-line);}

  details.why{margin:10px 0;padding:10px 14px;border-radius:12px;background:#f6f8fc;}
  details.why summary{cursor:pointer;font-weight:700;font-size:14.5px;}
  details.why p{margin:8px 0 2px;font-size:14.5px;color:var(--ink-soft);}

  .check{
    display:inline-flex;align-items:center;gap:10px;margin-top:8px;min-height:44px;
    padding:6px 14px;border-radius:12px;border:1px dashed #cfd8e8;cursor:pointer;
    font-size:15px;font-weight:700;color:var(--ink-soft);user-select:none;
  }
  .check input{width:22px;height:22px;accent-color:var(--g-dark);cursor:pointer;}
  .step.done .check{border-style:solid;border-color:var(--g);color:var(--g-dark);background:#fff;}

  .g-finish{
    display:none;margin:4px 0 16px;padding:14px 18px;border-radius:14px;
    background:var(--g-soft);border:1.5px solid var(--g);font-weight:700;
  }
  .g-finish.show{display:block;}

  .g-notes{margin:18px 0 0;padding:14px 18px 10px;border-radius:16px;background:#fff8eb;border:1px solid #f3d9a4;}
  .g-notes h3{margin:0 0 6px;font-size:16px;color:#7a4b00;}
  .g-notes ul{margin:0;padding-left:20px;font-size:14.5px;}
  .g-notes li{margin:6px 0;}

  /* 안내 그림 — 휴대폰에서는 글자가 너무 작아지지 않게 가로로 밀어 보게 한다 */
  .fig{margin:12px 0 16px;}
  .fig-art{border:1px solid var(--line);border-radius:14px;overflow-x:auto;background:#fbfcfe;}
  .fig-art svg{display:block;width:100%;height:auto;min-width:560px;}
  .fig figcaption{margin-top:7px;font-size:14px;line-height:1.6;color:var(--ink-soft);}
  .fig figcaption b{color:var(--ink);}

  /* 설문지 안내(과목·문항 고치기)에 쓰는 소제목 · 강조 상자 · 코드 상자 */
  .s-body h4{margin:18px 0 6px;font-size:16px;font-weight:800;}
  .callout{margin:10px 0 14px;padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.65;}
  .callout ul{margin:6px 0 0;padding-left:20px;}
  .callout li{margin:3px 0;}
  .callout.warn{background:#fff8eb;border:1.5px solid #f3d9a4;}
  .callout.strong{background:#fef2f2;border:1.5px solid #fca5a5;}
  pre.code{
    margin:8px 0 10px;padding:12px 14px;border-radius:12px;background:#0f172a;color:#e2e8f0;
    font:13.5px/1.65 ui-monospace,Consolas,"D2Coding","Malgun Gothic",monospace;overflow-x:auto;white-space:pre;
  }
  pre.code .cm{color:#94a3b8;}
  pre.code .hl{background:rgba(251,191,36,.22);color:#fde68a;border-radius:3px;}
  .s-body code{padding:1px 6px;border-radius:6px;background:#f1f4fa;border:1px solid #dbe2ee;font:13.5px ui-monospace,Consolas,monospace;}

  @media (max-width:520px){
    .wrap{padding:28px 16px 48px;}
    .grid{grid-template-columns:1fr;}
    .p-head{padding:14px 16px;}
    .p-head h2{font-size:18px;}
    .p-body{padding:14px 16px 20px;}
    .choice{padding:14px;gap:12px;}
    .gp-head{padding:16px 18px;gap:12px;}
    .step{grid-template-columns:minmax(0,1fr);gap:8px;padding:14px;}
    .step .num{width:34px;height:34px;font-size:16px;}
    .setting th{width:auto;}
    .btn{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 카드 목록 화면 -->
  <div id="portalView">
    <header class="hero">
      <span class="badge">📚 티쳐무의 정보교육 포털</span>
      <h1>영역으로 찾는 <span class="grad">정보 수업 도구함</span></h1>
      <p class="subtitle">웹교과서, 수업교안 노트, 영역별 학습 자료를 한 곳에서. 카드를 클릭하면 새 탭에서 열립니다.</p>
    </header>

    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="text" placeholder="사이트 이름으로 검색…" autocomplete="off">
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <div id="sections"></div>
    <div class="empty" id="empty">검색 결과가 없어요. 다른 키워드로 찾아보세요.</div>
  </div>

  <!-- 제출형 활동지: 사본을 만든 뒤 배포까지 따라 하는 안내 화면 (주소 #copy-<key>) -->
  <main id="guideView" class="guide-page" hidden></main>

  <footer>
    <div>© 티쳐무(무무) · 정보교육 웹 자료 모음</div>
    <div style="margin-top:6px;opacity:.8">자료는 GitHub Pages(trmoo.github.io)와 Google Apps Script 웹앱으로 제공됩니다.</div>
  </footer>
</div>

<!-- 제출형 활동지 카드를 누르면 뜨는 창 -->
<dialog id="panel" class="panel" aria-labelledby="pTitle"></dialog>

<!-- 안내 그림(SVG)을 그리는 부품 — 이 파일이 없어도 포털은 열리고 안내 글만 보인다 -->

let activeCat = "전체";

// build filter chips
// 단추에는 짧은 이름(chip)을 보여 주고, 거를 때는 칸 제목(cat)으로 맞춘다
const cats = [{cat:"전체", chip:"전체"}, ...DATA.map(d=>({cat:d.cat, chip:d.chip || d.cat}))];
filtersEl.innerHTML = cats.map(c=>`<button class="chip${c.cat==="전체"?" active":""}" data-cat="${c.cat}">${c.chip}</button>`).join("");
filtersEl.addEventListener('click', e=>{
  const btn = e.target.closest('.chip'); if(!btn) return;
  activeCat = btn.dataset.cat;
  [...filtersEl.children].forEach(ch=>ch.classList.toggle('active', ch===btn));
  render();
});

qEl.addEventListener('input', render);

function prettyUrl(url){
  const bare = url.replace(/^https?:\/\//,'');
  return bare.length > 46 ? bare.slice(0,43) + '…' : bare;
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 구글 시트 주소(또는 ID)에서 ID만 꺼낸다 — …/d/<ID>/copy · /edit?usp=sharing 어느 것을 붙여 넣어도 된다
function sheetId(s){
  if(!s) return "";
  const m = String(s).match(/\/d\/([A-Za-z0-9_-]{20,})/);
  if(m) return m[1];
  return /^[A-Za-z0-9_-]{20,}$/.test(s) ? s : "";
}
// 주소 끝을 /copy 로 두면 구글이 「사본 만들기」 화면을 띄운다 (시트에 붙은 Apps Script 도 함께 복사된다)
function copyUrl(t){
  const id = sheetId(t && t.sheet);
  return id ? `https://docs.google.com/spreadsheets/d/${id}/copy` : "";
}

function findTeacherItem(key){
  for(const g of DATA) for(const it of g.items){
    if(it.teacher && it.teacher.key === key) return it;
  }
  return null;
}

// 제출형 활동지 카드 — 카드를 누르면 고르는 창, 아래 두 단추는 바로 간다
function teacherCard(it, group){
  const t = it.teacher;
  const url = copyUrl(t);
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', group.color);
  card.style.setProperty('--accent-soft', group.soft);
  card.innerHTML = `
    <div class="icon">${it.icon}</div>
    <h3><button type="button" class="stretch" data-panel="${esc(t.key)}">${esc(it.title)}</button></h3>
    <p>${esc(it.desc)}</p>
    <div class="card-actions">
      ${url
        ? `<a class="ca primary" href="${url}" target="_blank" rel="noopener" data-copy-go="${esc(t.key)}">🧑‍🏫 교사용 사본 만들기</a>`
        : `<span class="ca wait">🧑‍🏫 원본 준비 중</span>`}
      ${t.test ? `<a class="ca" href="${esc(t.test)}" target="_blank" rel="noopener">▶ 테스트 페이지</a>` : ''}
    </div>`;
  return card;
}

function render(){
  const q = qEl.value.trim().toLowerCase();
  sectionsEl.innerHTML = "";
  let total = 0;

  DATA.forEach(group=>{
    if(activeCat!=="전체" && activeCat!==group.cat) return;
    const items = group.items.filter(it=>
      !q || it.title.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q)
    );
    // 자료가 아직 없는 칸은 검색하지 않을 때만 「준비 중」 카드로 보여 준다
    const soon = group.items.length===0 && group.soon && !q;
    if(items.length===0 && !soon) return;
    total += items.length;

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `
      <div class="section-head">
        <span class="dot" style="background:${group.dot}"></span>
        <h2>${group.cat}</h2>
        <span class="count">${soon ? "준비 중" : items.length}</span>
      </div>
      ${group.note ? `<div class="section-note">${group.note}</div>` : ''}
      <div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    if(soon){
      const box = document.createElement('div');
      box.className = 'card soon';
      box.style.setProperty('--accent', group.color);
      box.style.setProperty('--accent-soft', group.soft);
      box.innerHTML = `<div class="icon">🛡️</div><h3>준비 중입니다</h3><p>${group.soon}</p>`;
      grid.appendChild(box);
      total += 1;
    }
    items.forEach(it=>{
      if(it.teacher){ grid.appendChild(teacherCard(it, group)); return; }
      const a = document.createElement('a');
      a.className = 'card';
      a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      a.style.setProperty('--accent', group.color);
      a.style.setProperty('--accent-soft', group.soft);
      a.innerHTML = `
        <div class="icon">${it.icon}</div>
        <h3>${it.title}</h3>
        <p>${it.desc}</p>
        <span class="go">바로가기
          ${ARROW}
        </span>
        <div class="url">${prettyUrl(it.url)}</div>`;
      grid.appendChild(a);
    });
    sectionsEl.appendChild(sec);
  });

  emptyEl.style.display = total===0 ? 'block' : 'none';
}

// ─── ① 카드를 누르면 뜨는 창: 교사용 사본 / 테스트 페이지 ─────────────
function panelHtml(it){
  const t = it.teacher;
  const url = copyUrl(t);
  const copyChoice = url
    ? `<a class="choice primary" href="${url}" target="_blank" rel="noopener" data-copy-go="${esc(t.key)}">
        <span class="c-ico">🧑‍🏫</span>
        <span class="c-txt"><b>교사용 사본 만들기</b>
          <small>선생님 드라이브에 이 활동지의 사본(시트 + Apps Script)이 생깁니다. 사본 화면은 새 탭으로 열리고, 이 화면은 배포까지 따라 하는 그림 안내로 넘어갑니다.</small></span>
        <span class="c-go">${ARROW}</span>
      </a>`
    : `<div class="choice wait"><span class="c-ico">🧑‍🏫</span>
        <span class="c-txt"><b>원본 준비 중</b><small>배포용 원본 시트를 준비하고 있어요.</small></span></div>`;

    ? `<a class="choice" href="${esc(t.test)}" target="_blank" rel="noopener">

        <span class="c-txt"><b>테스트 페이지</b>
          <small>학생 화면을 미리 둘러보는 체험용입니다(새 탭). 입력한 내용은 티쳐무 선생님의 시험용 시트에 남으니, 실제 이름·학번 대신 연습용 값(예: 20101)을 넣어 주세요.</small></span>
        <span class="c-go">${ARROW}</span>
      </a>`
    : '';
  return `
  <div class="p-head">
    <div class="g-icon">${it.icon}</div>

      <div class="g-kicker">제출형 활동지 · 구글 시트 + Apps Script</div>

  </div>`;
}

function openPanel(key){
  const it = findTeacherItem(key);
  if(!it) return;
  panelEl.innerHTML = panelHtml(it);
  document.documentElement.classList.add('locked');
  if(typeof panelEl.showModal === 'function'){ if(!panelEl.open) panelEl.showModal(); }
  else panelEl.setAttribute('open', '');
}

// 크롬은 대화상자의 'close' 알림을 다음 화면 그리기 때 보내서, 탭이 가려져 있으면 한참 늦는다.
// 알림을 기다리지 않고 닫는 자리에서 바로 뒤 화면 스크롤 잠금을 푼다 (Esc 로 닫을 때만 알림 쪽이 푼다)
function closePanel(){
  if(typeof panelEl.close === 'function'){ if(panelEl.open) panelEl.close(); }
  else panelEl.removeAttribute('open');
  document.documentElement.classList.remove('locked');
}
panelEl.addEventListener('close', ()=>{ if(!panelEl.open) document.documentElement.classList.remove('locked'); });
panelEl.addEventListener('click', e=>{ if(e.target === panelEl) closePanel(); });   // 바깥 어두운 곳

// ─── ② 사본을 만든 뒤 배포까지 따라 하는 안내 화면 ─────────────────────
// 단계 체크는 이 탭을 열어 둔 동안만 기억한다 (아무것도 저장하지 않는다)
const PROGRESS = {};
let portalScroll = 0;

function guideLink(key){
  return location.href.split('#')[0] + '#copy-' + key;
}

// 안내 그림 한 장 — guide-figures.js 가 없으면(불러오기 실패) 그림 없이 글만 보여 준다
function fig(name, arg, caption){
  const GF = window.GuideFigures;
  if(!GF || !GF[name]) return '';
  return `<figure class="fig"><div class="fig-art">${GF[name](arg)}</div><figcaption>${caption}</figcaption></figure>`;
}

// 단계 하나 — 제목 · 본문 · 「마쳤어요」 체크

// 2단계(설문지) — 과목 이름과 문항을 우리 수업에 맞게
function editStepBody(it){
  const t = it.teacher;
  const sub = esc(t.subject || '프로그래밍');
  const n = Number(t.count) || 6;
  return `
      <p class="hint">${sub} 수업에 그대로 쓰신다면 이 단계는 건너뛰고 체크만 하세요.</p>
      <p>사본 시트에서 <span class="ui">확장 프로그램</span> › <span class="ui">Apps Script</span>를 열면, 왼쪽 「파일」에
        <span class="ui">Code.gs</span>(응답을 시트에 적는 코드)와 <span class="ui">Index.html</span>(학생이 보는 화면)이 있습니다.
        <b>파일 이름은 바꾸지 마세요</b> — 코드가 이름으로 서로를 찾습니다.</p>
      ${fig('edit', { word: t.subject || '프로그래밍' },
        `① 왼쪽 <b>Code.gs</b>(다음엔 <b>Index.html</b>) → ② <b>Ctrl+H</b> 로 「${sub}」 → 우리 과목 → ③ <b>모두 바꾸기</b> → ④ <b>저장</b>(Ctrl+S)`)}

      <h4>① 과목 이름 바꾸기 — 가장 쉬운 방법</h4>
      <ol>
        <li><span class="ui">Code.gs</span>를 누르고 <b>Ctrl+H</b>(찾아 바꾸기) → 위 칸에 <b>${sub}</b>, 아래 칸에 우리 과목(예: <b>데이터 과학</b>) → <span class="ui">모두 바꾸기</span>.</li>
        <li><span class="ui">Index.html</span>에서도 똑같이 합니다. 화면 제목·문항·브라우저 탭 제목·시트 머리글이 한꺼번에 바뀝니다.</li>
        <li><b>조사</b>만 확인하세요 — 「왜 ${sub}을 배우려고 하는지?」 문항은 과목 이름 바로 뒤에 「을」이 붙어 있어, 받침 없는 과목이면 「정보을」처럼 어색해집니다(두 파일에 한 곳씩).</li>
        <li>「정보/컴퓨터/AI 과목…」, 「이전 수업(정보/데이터과학/인공지능 기초)」처럼 다른 과목 이름이 들어간 문항은 우리 수업에 맞게 직접 고쳐 주세요.</li>
        <li>두 파일 모두 <b>Ctrl+S</b>(또는 💾)로 저장합니다.</li>
      </ol>

      <h4>② 문항 글 바꾸기 (개수는 그대로)</h4>
      <p>문항은 <b>두 곳</b>에 같은 차례로 적혀 있습니다. 두 곳을 함께 고치세요.</p>
<pre class="code"><span class="cm">// Code.gs — 시트 첫 줄(머리글)에 들어갈 문항 이름</span>
var QUESTIONS = [
  '진로 희망과 그 이유',
  '<span class="hl">${sub} 과목을 선택한 이유</span>',
  …
];

<span class="cm">&lt;!-- Index.html — 학생 화면에 보이는 문항 (&lt;br&gt; 은 줄바꿈) --&gt;</span>
&lt;div class="q"&gt;<span class="hl">${sub} 과목을&lt;br&gt;선택한 이유</span>&lt;/div&gt;
&lt;textarea name="q1" …&gt;&lt;/textarea&gt;</pre>
      <p class="hint">Code.gs 의 <b>n번째</b> 문항이 Index.html 의 <code>name="q(n−1)"</code> 칸과 짝입니다 — 두 번째 문항이 <code>q1</code>. 차례가 어긋나면 답이 엉뚱한 열에 저장돼요.</p>

      <details class="why">
        <summary>③ 문항 수를 늘리거나 줄이려면</summary>
        <ol>
          <li><b>Index.html</b> — 문항 칸 하나는 <code>&lt;div class="box …"&gt;</code>부터 짝이 맞는 <code>&lt;/div&gt;</code>까지입니다. 늘릴 때는 한 칸을 통째로 복사해 붙이고, 줄일 때는 통째로 지웁니다. 새 칸의 class 에 <code>b-interest</code>를 넣으면 두 칸 너비로 한 줄을 차지합니다.</li>
          <li>칸 속 <code>name="q0"</code>, <code>"q1"</code>, … 번호를 <b>0부터 빠짐없이</b> 차례로 다시 매깁니다.</li>
          <li>Index.html 아래쪽 <code>for (var i = 0; i &lt; ${n}; i++)</code> 의 <b>${n}</b>을 새 문항 수로 바꿉니다.</li>

        </ol>
      </details>

}

// 3단계 — 웹 앱으로 배포하고 주소를 학생에게

        <li>⚙ › <span class="ui">웹 앱</span>을 고르고, 두 칸을 이렇게 맞춥니다.${settingHtml('학생은 구글 로그인 없이 설문을 엽니다.')}</li>
      </ol>
      ${fig('deploy', null,
        `① <b>톱니바퀴 ⚙</b> → ② <b>웹 앱</b> → ③ 실행은 <b>나</b> → ④ 액세스는 <b>모든 사용자</b> → ⑤ <b>배포</b>`)}
      <h4>처음 배포할 때는 권한을 승인합니다</h4>
      <p>이 설문지는 시트 메뉴가 없어서, <span class="ui">배포</span>를 누를 때 권한을 묻습니다.</p>
      ${authHtml('<span class="ui">액세스 승인</span> 단추가 나오면 누르고 내 구글 계정을 고릅니다.',
        '승인이 끝나면 배포가 마무리되고 <b>웹 앱 URL</b>이 나옵니다.')}

      <ol start="3">
        <li>나온 <b>웹 앱 URL</b>을 <span class="ui">복사</span>해 학생에게 줍니다 (클래스룸 · QR 코드 등).</li>
      </ol>

      <p class="hint">✅ <b>확인하기</b> — 시크릿 창(Ctrl+Shift+N)에서 그 주소를 열어 시험 삼아 한 번 제출해 보세요. 사본 시트의 <b>「설문 응답」 탭 맨 아래</b>에 한 줄이 생기면 성공입니다(시험 줄은 지워도 됩니다).</p>

      ${fig('manage', null, `① 연필(<b>수정</b>) → ② 버전 <b>「새 버전」</b> → ③ <b>배포</b>`)}`;

  return `
      <ol>
        <li>사본 시트 메뉴에서 <span class="ui">확장 프로그램</span> › <span class="ui">Apps Script</span>를 눌러 편집기를 엽니다. (새 탭으로 열려요)</li>
        <li>편집기 오른쪽 위 파란 <span class="ui">배포</span> › <span class="ui">새 배포</span>를 누릅니다.</li>
      </ol>
      ${fig('editor', null,
        `① <b>확장 프로그램</b> → ② <b>Apps Script</b> → 새 탭의 편집기에서 ③ <b>배포</b> → ④ <b>새 배포</b>`)}
      <ol start="3">
        <li>「유형 선택」 옆 톱니바퀴 ⚙ › <span class="ui">웹 앱</span>을 고르고, 두 칸을 이렇게 맞춥니다.${settingHtml('학생은 구글 로그인 없이 학번으로 들어와요.')}</li>

      <ol start="4">
        <li><span class="ui">배포</span>를 누릅니다. 권한을 또 물으면 2단계처럼 승인하세요.</li>

      </ol>

function notesHtml(it){
  const t = it.teacher;
  const test = `<li>학생에게는 꼭 <b>3단계에서 받은 선생님 주소</b>를 주세요. 도구함의 <b>테스트 페이지</b>는 둘러보기용이라, 거기에 낸 답은 선생님 시트가 아니라 티쳐무 선생님의 시험용 시트로 갑니다.</li>`;
  const items = t.kind === 'survey' ? [
    test,
    `<li>응답은 사본 시트의 <b>「설문 응답」</b> 탭에 한 줄씩 쌓입니다(제출 시각 · 학번/이름 · 문항 차례). 같은 학생이 여러 번 내면 여러 줄이 되니 <b>맨 아래 줄이 가장 최근</b> 응답이에요.</li>`,
    `<li>사본은 <b>만든 날의 버전</b> 그대로입니다. 편집기에서 고친 뒤에는 <b>「새 버전」으로 다시 배포</b>해야 학생 화면에 반영됩니다.</li>`,
    `<li>© 티쳐무 · 학교 수업 목적으로 이용해 주세요. <b>과목과 문항은 자유롭게 고쳐 쓰셔도 됩니다.</b> 고친 것을 다시 나누는 일은 먼저 문의해 주세요.</li>`,
  ] : [
    test,
    `<li>학생 답과 계정은 <b>선생님 시트에만</b> 저장됩니다. 비밀번호는 암호화(해시)해 저장하므로 선생님도 볼 수 없어요. 잊은 학생은 <span class="ui">${esc(t.menu)}</span> › <span class="ui">${esc(t.reset)}</span>로 풀어 주세요.</li>`,
    `<li>사본은 <b>만든 날의 버전</b> 그대로입니다. 이 활동지가 새로 고쳐져도 선생님 사본은 바뀌지 않으니, 새 학기에는 사본을 새로 만들어 쓰세요.</li>`,
    `<li>© 티쳐무 · 학교 수업 목적으로 이용해 주세요. 화면 아래 저작권 표시는 그대로 두어 주시고, 재배포나 고쳐서 다시 나누는 일은 먼저 문의해 주세요.</li>`,
  ];
  return `
  <div class="g-notes">
    <h3>⚠ 꼭 알아 두세요</h3>
    <ul>${items.join('\n      ')}</ul>
  </div>`;
}

function guidePageHtml(it, fromCopy){
  const t = it.teacher;
  const url = copyUrl(t);
  const survey = t.kind === 'survey';
  const sub = esc(t.subject || '프로그래밍');
  // 앱마다 단계 차례가 다르다 — 설문지는 시트 메뉴가 없어 「시트 준비」 대신 「과목·문항 고치기」, 권한 승인은 배포 때
  const steps = survey ? [
    ['새 탭에서 <span class="ui">사본 만들기</span>를 누릅니다.', copyStepBody(it, fromCopy)],
    [`(${sub} 수업이 아니라면) 과목 이름과 문항을 우리 수업에 맞게 고칩니다.`, editStepBody(it), '이 단계를 마쳤어요 (고칠 것이 없으면 그냥 체크)'],
    ['<span class="ui">배포</span> → <span class="ui">새 배포</span> → 유형 선택 <span class="ui">웹 앱</span>으로 배포하고, 나온 주소를 학생에게 줍니다.', deployStepBody(it)],
  ] : [
    ['새 탭에서 <span class="ui">사본 만들기</span>를 누릅니다.', copyStepBody(it, fromCopy)],
    [`사본 시트의 앱 메뉴에서 <span class="ui">${esc(t.setup)}</span>를 누르고 권한을 승인합니다.`, menuStepBody(it)],
    ['<span class="ui">확장 프로그램</span> → <span class="ui">Apps Script</span> → <span class="ui">배포</span> → <span class="ui">새 배포</span> → <span class="ui">웹 앱</span>을 고릅니다. 실행은 「나」, 액세스는 「모든 사용자」로 두고, 나온 주소를 학생에게 줍니다.', deployStepBody(it)],
  ];

  return `
  <div class="gp-top">
    <button type="button" class="btn small" data-home>← 도구함으로 돌아가기</button>
    <div class="gp-tools">
      <button type="button" class="btn small" data-copy="${esc(guideLink(t.key))}">🔗 이 안내 링크 복사</button>
      ${url ? `<a class="btn small" href="guide/${esc(t.key)}-guide.png" target="_blank" rel="noopener">🖼 그림 한 장으로 보기</a>` : ''}
    </div>
  </div>

  <header class="gp-head">
    <div class="g-icon">${it.icon}</div>
    <div class="g-titles">
      <div class="g-kicker">🧑‍🏫 선생님용 · 사본을 만든 뒤 배포까지</div>
      <h1 class="gp-title">${esc(it.title)}</h1>
    </div>
  </header>

  ${fromCopy ? `<div class="gp-banner" role="status">✅ 새 탭에 <b>사본 만들기</b> 화면을 열었어요. 그 탭에서 파란 <b>[사본 만들기]</b>를 누른 뒤, 이 화면의 <b>2단계</b>부터 따라 하세요.</div>` : ''}

  ${survey ? `<div class="callout strong">📌 <b>이 설문지만 다른 점</b>
    <ul>
      <li>배포할 때 <b>「유형 선택」은 반드시 「웹 앱」</b>입니다. 그래야 학생에게 줄 주소가 생깁니다.</li>
      <li>${sub} 수업이 아니라면 <b>2단계에서 과목 이름과 문항</b>을 바꿔 쓰세요. 찾아 바꾸기 한 번이면 됩니다.</li>
      <li>시트 메뉴가 없어서 <b>권한 승인은 배포할 때</b> 합니다.</li>
    </ul>
  </div>` : ''}

  <ul class="g-pre">
    <li>${survey
      ? '이 설문지는 <b>구글 시트에 붙은 Apps Script 앱</b>입니다. 사본을 만들면 선생님 드라이브에 <b>선생님만의 설문지</b>가 생기고, 응답은 <b>선생님 시트의 「설문 응답」 탭</b>에만 쌓입니다.'
      : '이 활동지는 <b>구글 시트에 붙은 Apps Script 앱</b>입니다. 사본을 만들면 선생님 드라이브에 <b>선생님만의 앱</b>이 생기고, 학생 답은 <b>선생님 시트에만</b> 저장됩니다.'}</li>
    <li>학교(교육청) 계정은 3단계에서 <b>「모든 사용자」</b>가 안 보일 수 있어요. 그럴 땐 <b>개인 Gmail 계정</b>으로 하세요.</li>
    <li>그림은 실제 화면을 단순하게 다시 그린 안내도예요. 주황 번호 차례대로 누르면 됩니다. 구글 화면이 바뀌면 모양이 조금 다를 수 있어요.</li>
  </ul>

  <div class="g-progress" aria-live="polite">
    <div class="bar"><span></span></div>
    <span class="txt"></span>
  </div>

  ${steps.map((s, i) => stepHtml(i, s[0], s[1], s[2])).join('\n')}

  <div class="g-finish" role="status">🎉 끝! 이제 학생에게 <b>3단계에서 받은 선생님 주소</b>를 알려 주세요.</div>

  ${notesHtml(it)}

  <div class="gp-bottom"><button type="button" class="btn" data-home>← 도구함으로 돌아가기</button></div>`;
}

function updateProgress(key){
  const done = PROGRESS[key];
  const steps = guideView.querySelectorAll('.step');
  const total = steps.length;
  const n = done.slice(0, total).filter(Boolean).length;
  steps.forEach((sec, i)=>{
    sec.classList.toggle('done', !!done[i]);
    sec.querySelector('.num').textContent = done[i] ? '✓' : String(i + 1);
    sec.querySelector('[data-done]').checked = !!done[i];
  });
  guideView.querySelector('.g-progress .bar span').style.width = (n / total * 100) + '%';
  guideView.querySelector('.g-progress .txt').textContent = `${total}단계 중 ${n}단계 마침`;
  guideView.querySelector('.g-finish').classList.toggle('show', n === total);
}

// 안내 화면으로 넘어간다. push: 뒤로 가기로 카드 목록에 돌아올 수 있게 방문 기록을 남긴다
function showGuide(key, opts){
  opts = opts || {};
  const it = findTeacherItem(key);
  if(!it){ showPortal(); return; }
  if(opts.push){
    if(guideView.hidden) portalScroll = window.scrollY;   // 카드 목록에서 넘어올 때만 돌아갈 자리를 기억한다
    history.pushState({ view:'guide', key, fromPortal:true }, '', '#copy-' + key);
  }
  PROGRESS[key] = PROGRESS[key] || [false, false, false];
  if(opts.fromCopy) PROGRESS[key][0] = true;      // 방금 사본 화면을 새 탭으로 열었다
  guideView.innerHTML = guidePageHtml(it, !!opts.fromCopy);
  guideView.dataset.key = key;
  updateProgress(key);
  portalView.hidden = true;
  guideView.hidden = false;
  document.title = `${it.title} · 선생님용 안내 — ${PORTAL_TITLE}`;
  window.scrollTo(0, 0);
}

function showPortal(){
  const wasGuide = !guideView.hidden;
  guideView.hidden = true;
  portalView.hidden = false;
  document.title = PORTAL_TITLE;
  if(wasGuide) window.scrollTo(0, portalScroll);
}

// [도구함으로 돌아가기] — 카드에서 넘어왔으면 뒤로 가기, 링크로 바로 들어왔으면 주소만 바꾼다
function goHome(){
  if(history.state && history.state.view === 'guide' && history.state.fromPortal){ history.back(); return; }
  history.replaceState(null, '', location.pathname + location.search);
  showPortal();
}

// 주소 끝이 #copy-<key> 이면 그 안내 화면, 아니면 카드 목록
function route(){
  const key = (location.hash.match(/^#copy-([\w-]+)$/) || [])[1];
  if(key && findTeacherItem(key)){
    if(guideView.hidden || guideView.dataset.key !== key) showGuide(key);
  } else if(!guideView.hidden){
    showPortal();
  }
}
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);

// 대화상자가 열려 있으면 바깥은 눌리지 않으므로, 복사용 글상자도 열린 대화상자 안에 잠깐 넣었다 뺀다
async function copyText(text, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){ /* 아래 방법으로 한 번 더 */ }
  if(!ok){
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    (panelEl.open ? panelEl : document.body).appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
  }
  const old = btn.innerHTML;
  btn.textContent = ok ? '✅ 복사했어요' : '⚠ 복사가 안 돼요 — 직접 선택해 복사해 주세요';
  setTimeout(()=>{ btn.innerHTML = old; }, 1800);
}

document.addEventListener('click', e=>{
  // 교사용 사본 만들기 — 새 탭(구글 사본 화면)은 링크가 그대로 열고, 이 탭은 그다음에 안내 화면으로 넘긴다
  const go = e.target.closest('[data-copy-go]');
  if(go){
    const key = go.dataset.copyGo;
    setTimeout(()=>{ closePanel(); showGuide(key, { push:true, fromCopy:true }); }, 0);
    return;
  }
  const p = e.target.closest('[data-panel]');
  if(p){ openPanel(p.dataset.panel); return; }
  const g = e.target.closest('[data-guide]');
  if(g){ closePanel(); showGuide(g.dataset.guide, { push:true }); return; }
  if(e.target.closest('[data-close]')){ closePanel(); return; }
  if(e.target.closest('[data-home]')){ goHome(); return; }
  const c = e.target.closest('[data-copy]');
  if(c){ copyText(c.dataset.copy, c); return; }
});
guideView.addEventListener('change', e=>{
  const box = e.target.closest('[data-done]');
  if(!box) return;
  const key = guideView.dataset.key;
  PROGRESS[key][Number(box.dataset.done)] = box.checked;
  updateProgress(key);
});
guideView.addEventListener('focusin', e=>{
  if(e.target.classList.contains('link-box')) e.target.select();
});

render();
route();   // #copy-<key> 링크로 바로 들어온 선생님은 곧장 안내 화면
</script>
</body>
</html>
